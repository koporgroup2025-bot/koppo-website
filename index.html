function thaiPatternUrl(fg='#E8604A', bg='transparent', op=1) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><g fill='${fg}' opacity='${op}'><path d='M20 4L26 10L20 16L14 10Z'/><path d='M20 24L26 30L20 36L14 30Z'/><circle cx='4' cy='20' r='2'/><circle cx='36' cy='20' r='2'/></g></svg>`;
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}

function getShipping(items) {
  const cold = items.some(i => i.product.shippingType === 'cold');
  return cold
    ? {type:'cold', label:'ส่งแบบเย็น ❄️', cost:150, reason:'มีสินค้าที่ต้องแช่เย็น'}
    : {type:'normal', label:'ส่งแบบปกติ 📦', cost:50, reason:'สามารถส่งแบบปกติได้'};
}

function cartSubtotal(items) {
  return items.reduce((s,i) => s + i.product.price * i.qty, 0);
}

function fileToBase64(file) {
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload = e => res({ base64: e.target.result.split(',')[1], preview: e.target.result, mimeType: file.type });
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function apiCall(method, body) {
  try {
    const opts = {
      method,
      headers: {'Content-Type':'application/json'},
    };
    if (body) opts.body = JSON.stringify(body);
    const url = method === 'GET'
      ? `/api/proxy?action=${body?.action||'products'}`
      : '/api/proxy';
    const res  = await fetch(url, opts);
    return await res.json();
  } catch(err) {
    console.warn('API call failed, using local data:', err.message);
    return null;
  }
}

function ScallopEdge({color='#FFF8E7',height=20,count=14}) {
  const r = 100/count/2;
  const path = `M 0 ${height} L 0 0 ${Array.from({length:count}).map((_,i)=>`A ${r} ${height} 0 0 0 ${(i+1)*(100/count)} 0`).join(' ')} L 100 ${height} Z`;
  return <svg width="100%" height={height} viewBox={`0 0 100 ${height}`} preserveAspectRatio="none" style={{display:'block'}}><path d={path} fill={color}/></svg>;
}

function StickerBtn({children,bg='#E8604A',fg='#FFF8E7',size='md',full=false,onClick,disabled=false,style={}}) {
  const sizes = {sm:{p:'10px 18px',fs:13,r:999,off:3},md:{p:'13px 24px',fs:15,r:999,off:4},lg:{p:'16px 30px',fs:17,r:999,off:5},xl:{p:'20px 40px',fs:22,r:999,off:6}};
  const s = sizes[size]||sizes.md;
  return (
    <button onClick={onClick} disabled={disabled} style={{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,padding:s.p,fontSize:s.fs,fontWeight:800,fontFamily:'"Mali","Noto Sans Thai",sans-serif',background:disabled?'#ccc':bg,color:disabled?'#888':fg,border:`2.5px solid #2A1810`,borderRadius:s.r,boxShadow:disabled?'none':`${s.off}px ${s.off}px 0 #2A1810`,cursor:disabled?'not-allowed':'pointer',width:full?'100%':'auto',transition:'transform 0.1s,box-shadow 0.1s',...style}}
      onMouseDown={e=>{if(!disabled){e.currentTarget.style.transform='translate(2px,2px)';e.currentTarget.style.boxShadow=`${s.off-2}px ${s.off-2}px 0 #2A1810`}}}
      onMouseUp={e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow=`${s.off}px ${s.off}px 0 #2A1810`}}>
      {children}
    </button>
  );
}

function ImageBox({src,alt,tone,radius=18,height='100%',style={}}) {
  const [err,setErr] = useState(false);
  if (!src||err) return (
    <div style={{width:'100%',height,borderRadius:radius,background:`repeating-linear-gradient(135deg,${tone}33,${tone}33 8px,${tone}22 8px,${tone}22 16px)`,border:`2px dashed ${tone}88`,display:'flex',alignItems:'center',justifyContent:'center',...style}}>
      <span style={{fontFamily:'"Noto Sans Thai"',fontSize:12,color:tone,opacity:0.8}}>{alt}</span>
    </div>
  );
  return <img src={src} alt={alt} onError={()=>setErr(true)} style={{width:'100%',height,borderRadius:radius,objectFit:'cover',...style}}/>;
}

function Spinner() {
  return <div style={{width:24,height:24,border:'3px solid #FFF8E7',borderTop:'3px solid #E8604A',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}></div>;
}

function Toast({msg,onClose}) {
  useEffect(()=>{if(msg){const t=setTimeout(onClose,3500);return()=>clearTimeout(t);}}, [msg]);
  if(!msg)return null;
  const isErr = msg.startsWith('❌');
  return (
    <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:9999,background:isErr?'#C04030':'#2A1810',color:'#FFF8E7',padding:'12px 24px',borderRadius:999,fontFamily:'"Mali",sans-serif',fontWeight:700,fontSize:14,border:'2.5px solid #FFF8E7',boxShadow:'0 8px 24px rgba(0,0,0,0.3)',whiteSpace:'nowrap',maxWidth:'90vw',animation:'fadeIn 0.3s ease'}}>
      {msg}
    </div>
  );
}

function VideoCard({product:p}) {
  const [playing,setPlaying] = useState(false);
  const ref = useRef();
  const toggle = () => {
    if(!ref.current)return;
    if(playing){ref.current.pause();setPlaying(false);}
    else{ref.current.play();setPlaying(true);}
  };
  return (
    <div style={{background:'#FFF8E7',borderRadius:18,padding:10,border:'2.5px solid #FFF8E7',boxShadow:'3px 3px 0 rgba(0,0,0,0.2)'}}>
      <div style={{position:'relative',borderRadius:12,overflow:'hidden',background:p.tone,aspectRatio:'16/10',cursor:'pointer'}} onClick={toggle}>
        {p.video
          ? <video ref={ref} src={p.video} style={{width:'100%',height:'100%',objectFit:'cover'}} playsInline onEnded={()=>setPlaying(false)}/>
          : <div style={{width:'100%',height:'100%',background:`linear-gradient(135deg,${p.tone}55,${p.tone}99)`}}/>
        }
        {!playing && (
          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{width:56,height:56,borderRadius:'50%',background:'#FFF8E7',boxShadow:`0 4px 0 ${p.tone},0 6px 16px rgba(0,0,0,0.2)`,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <div style={{width:0,height:0,borderLeft:`16px solid ${p.tone}`,borderTop:'10px solid transparent',borderBottom:'10px solid transparent',marginLeft:4}}/>
            </div>
          </div>
        )}
      </div>
      <div style={{padding:'10px 6px 4px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontFamily:'"Mali"',fontWeight:700,fontSize:14,color:'#2A1810'}}>{p.name}</div>
        <Pill bg={p.tone}>{playing?'▶ กำลังเล่น':'▶ ดูวิดีโอ'}</Pill>
      </div>
    </div>
  );
}

    <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',flexDirection:'column'}}>

function CartPage({cart,products,onBack,onQtyChange,onRemove,onCheckout}) {
  const [info,setInfo] = useState({name:'',phone:'',address:'',note:''});
  const [errors,setErrors] = useState({});
  const ship  = getShipping(cart);
  const sub   = cartSubtotal(cart);
  const total = sub + ship.cost;

  const validate = () => {
    const e={};
    if(!info.name.trim())   e.name='กรุณากรอกชื่อ';
    if(!info.phone.trim())  e.phone='กรุณากรอกเบอร์โทร';
    if(!info.address.trim())e.address='กรุณากรอกที่อยู่';
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const go = () => {
    if(validate()) onCheckout(info, ship, sub, total);
  };

  if(cart.length===0) return (
    <div style={{textAlign:'center',padding:'60px 20px'}}>
      <KoporMascot size={120} style={{margin:'0 auto 16px'}}/>
      <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:22,marginBottom:8}}>ตะกร้าว่างอยู่คร้าบ</div>
      <p style={{opacity:0.65,marginBottom:20}}>เลือกสินค้าแล้วกด + เพื่อใส่ตะกร้า</p>
      <StickerBtn bg="#E8604A" fg="#FFF8E7" size="md" onClick={onBack}>← กลับเลือกสินค้า</StickerBtn>
    </div>
  );

  return (
    <div className="scrollable" style={{minHeight:'100vh',paddingBottom:100}}>
      {/* progress */}
      <ProgressBar step={1}/>

      <div style={{padding:'16px 18px 0'}}>
        <h1 style={{fontFamily:'"Mali"',fontWeight:800,fontSize:24,marginBottom:4}}>ตะกร้าของคุณ</h1>
        <p style={{fontSize:12,opacity:0.65,marginBottom:16}}>{cart.reduce((s,i)=>s+i.qty,0)} กระปุก · พร้อมโดน</p>

        {/* items */}
        <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:18}}>
          {cart.map(({product:p,qty})=>(
            <Card key={p.id} radius={18} offset={3} style={{overflow:'hidden'}}>
              <div style={{display:'flex',gap:10,padding:12}}>
                <div style={{width:80,height:80,borderRadius:12,background:p.tone,padding:5,flexShrink:0}}>
                  <ImageBox src={p.images?.[0]} alt={p.name} tone="#FFF8E7" radius={8} height="100%"/>
                </div>
                <div style={{flex:1}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:18,lineHeight:1}}>{p.name}</div>
                    <button onClick={()=>onRemove(p.id)} style={{width:26,height:26,borderRadius:7,background:'transparent',border:'1.5px solid #2A181044',color:'#2A1810',cursor:'pointer',fontSize:14}}>×</button>
                  </div>
                  <div style={{fontSize:11,opacity:0.6,marginBottom:8}}>{p.sub}</div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,background:p.toneSoft,border:`2px solid ${p.tone}`,borderRadius:999,padding:'2px 4px'}}>
                      <button onClick={()=>onQtyChange(p.id,Math.max(1,qty-1))} style={{width:26,height:26,borderRadius:'50%',background:'#FFF8E7',border:'1.5px solid #2A1810',fontFamily:'"Mali"',fontWeight:800,fontSize:13,cursor:'pointer'}}>−</button>
                      <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:15,minWidth:18,textAlign:'center'}}>{qty}</div>
                      <button onClick={()=>onQtyChange(p.id,qty+1)} style={{width:26,height:26,borderRadius:'50%',background:'#FFF8E7',border:'1.5px solid #2A1810',fontFamily:'"Mali"',fontWeight:800,fontSize:13,cursor:'pointer'}}>+</button>

                    <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:18,color:p.tone}}>฿{p.price*qty}</div>

                </div>
              </div>

        {/* shipping */}

// PAYMENT PAGE
// ══════════════════════════════════════════════════════════════
function PaymentPage({cart,customerInfo,shipping,subtotal,total,onBack,onSuccess,setToast}) {
  const [slip,setSlip]      = useState(null);
  const [loading,setLoading]= useState(false);
  const fileRef             = useRef();

  const handleFile = async e => {
    const f = e.target.files?.[0];
    if(!f)return;
    if(f.size > 5*1024*1024){setToast('❌ ไฟล์ใหญ่เกิน 5MB');return;}
    try { setSlip(await fileToBase64(f)); } catch(err){ setToast('❌ อ่านไฟล์ไม่ได้ กรุณาลองใหม่'); }
  };

  const copyAccount = () => {
    navigator.clipboard?.writeText(CFG.BANK_ACCOUNT.replace(/-/g,''))
      .then(()=>setToast('✅ คัดลอกเลขบัญชีแล้ว'))
      .catch(()=>setToast('❌ ไม่สามารถคัดลอกได้'));
  };

  const confirm = async () => {
    if(!slip){setToast('❌ กรุณาแนบสลิปก่อนยืนยัน');return;}
    setLoading(true);
    const payload = {
      action: 'submitOrder',
      slipBase64:  slip.base64,
      slipMimeType:slip.mimeType,
      orderData: {
        ...customerInfo,
        items:        cart.map(({product:p,qty})=>({id:p.id,name:p.name,price:p.price,qty})),
        subtotal,
        shippingType: shipping.type,
        shippingCost: shipping.cost,
        total,
      }
    };
    const res = await apiCall('POST', payload);
    setLoading(false);
    if(res?.success) {
      onSuccess(res.orderId);
    } else {
      setToast('❌ ' + (res?.error || 'เกิดข้อผิดพลาด กรุณาลองใหม่'));
    }
  };

  return (
    <div className="scrollable" style={{minHeight:'100vh',paddingBottom:120}}>
      <ProgressBar step={2}/>
      <div style={{padding:'16px 18px 0'}}>
        <h1 style={{fontFamily:'"Mali"',fontWeight:800,fontSize:24,marginBottom:4}}>ชำระเงิน</h1>
        <p style={{fontSize:12,opacity:0.65,marginBottom:18}}>โอนผ่านธนาคาร · แนบสลิป · ยืนยันได้เลย</p>

        {/* order summary mini */}
        <Card radius={16} offset={3} style={{padding:'14px 16px',marginBottom:18}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:14}}>สรุปออเดอร์</div>
          </div>
          {cart.map(({product:p,qty})=>(
            <div key={p.id} style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}}>
              <span>{p.name} × {qty}</span>
              <span style={{fontFamily:'"Mali"',fontWeight:700}}>฿{p.price*qty}</span>
            </div>
          ))}
          <div style={{borderTop:'2px dashed #2A181033',marginTop:8,paddingTop:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:13}}>ยอดที่ต้องชำระ</div>
            <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:24,color:'#E8604A'}}>฿{total}</div>
          </div>
        </Card>

        {/* bank card */}
        <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:17,marginBottom:10}}>โอนเงินไปยัง</div>
        <BankCard total={total} onCopy={copyAccount}/>

        <div style={{marginTop:14,background:'#FFD93D',border:'2.5px solid #2A1810',borderRadius:14,padding:'12px 14px',display:'flex',gap:10,marginBottom:22,boxShadow:'3px 3px 0 #2A1810'}}>
          <div style={{fontSize:18}}>💡</div>
          <div style={{fontSize:12,lineHeight:1.5}}>
            <strong style={{fontFamily:'"Mali"'}}>โอนตามยอดที่กำหนดเท่านั้น</strong> เพื่อให้ระบบตรวจสอบได้อัตโนมัติ
          </div>
        </div>

        {/* upload slip */}
        <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:17,marginBottom:10}}>แนบสลิปการโอน</div>
        <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{display:'none'}}/>
        {!slip ? (
          <div onClick={()=>fileRef.current?.click()} style={{background:'#FFF8E7',border:'2.5px dashed #E8604A',borderRadius:20,padding:'32px 20px',textAlign:'center',cursor:'pointer',marginBottom:16}}>
            <div style={{width:64,height:64,borderRadius:'50%',background:'#E8604A22',border:'2.5px solid #E8604A',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E8604A" strokeWidth="2.4"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            </div>
            <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:17,marginBottom:4}}>แตะเพื่ออัพโหลดสลิป</div>
            <div style={{fontSize:12,opacity:0.65,marginBottom:14}}>JPG, PNG ไม่เกิน 5MB</div>
            <div style={{display:'flex',gap:8,justifyContent:'center'}}>
              <Pill bg="#E8604A">📷 ถ่ายรูป</Pill>
              <Pill bg="#FFF8E7" fg="#2A1810">📁 เลือกไฟล์</Pill>
            </div>
          </div>
        ) : (
          <div style={{marginBottom:16,background:'#FFF8E7',border:'2.5px solid #2A1810',borderRadius:18,padding:12,boxShadow:'3px 3px 0 #2A1810',display:'flex',gap:12,alignItems:'center'}}>
            <img src={slip.preview} alt="slip" style={{width:70,height:90,borderRadius:10,objectFit:'cover',border:'2px solid #2A1810'}}/>
            <div style={{flex:1}}>
              <Pill bg="#7AAE8E" style={{marginBottom:6}}>✓ อัพโหลดแล้ว</Pill>
              <div style={{fontSize:12,opacity:0.65,marginTop:4}}>แตะเพื่อเปลี่ยนรูป</div>
            </div>
            <button onClick={()=>{setSlip(null);fileRef.current?.click();}} style={{width:32,height:32,borderRadius:8,background:'transparent',border:'1.5px solid #2A181055',color:'#2A1810',cursor:'pointer',fontSize:14}}>↺</button>
          </div>
        )}
      </div>

      {/* sticky bottom */}
      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'#2A1810',backgroundImage:thaiPatternUrl('#E8604A','transparent',0.12),padding:'14px 18px 20px',zIndex:50}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div style={{fontFamily:'"Mali"',fontWeight:700,fontSize:13,color:'#FFF8E7',opacity:0.85}}>ยอดที่โอน</div>
          <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:28,color:'#FFD93D'}}>฿{total}</div>
        </div>
        <StickerBtn bg="#FFD93D" fg="#2A1810" size="lg" full disabled={loading} onClick={confirm}>
          {loading ? <span style={{display:'flex',alignItems:'center',gap:8}}><Spinner/> กำลังตรวจสอบ...</span> : '✓ ยืนยันการชำระเงิน'}
        </StickerBtn>
        <div style={{textAlign:'center',fontSize:11,color:'#FFF8E7',opacity:0.65,marginTop:8}}>ตรวจสอบสลิปอัตโนมัติ ภายใน 1 นาที</div>
      </div>
    </div>
  );
}

            </div>
          ))}
          <div style={{borderTop:'2px dashed #2A181033',marginTop:10,paddingTop:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontFamily:'"Mali"',fontWeight:800,fontSize:16}}>ชำระแล้ว</span>
            <span style={{fontFamily:'"Mali"',fontWeight:800,fontSize:26,color:'#7AAE8E'}}>฿{total}</span>
          </div>
        </Card>

        {/* address */}
        <Card radius={14} offset={2} style={{padding:'12px 14px',marginBottom:20,display:'flex',gap:10}}>
          <span style={{fontSize:18}}>📍</span>
          <div style={{fontSize:13,lineHeight:1.5}}>
            <div style={{fontFamily:'"Mali"',fontWeight:700}}>{customerInfo.name} · {customerInfo.phone}</div>
            <div style={{opacity:0.75}}>{customerInfo.address}</div>
          </div>
        </Card>

        {/* timeline */}
        <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:18,marginBottom:12}}>กำหนดการจัดส่ง</div>
        <div style={{display:'inline-flex',background:'#FFF8E7',border:'2.5px solid #2A1810',borderRadius:999,padding:4,boxShadow:'3px 3px 0 #2A1810',marginBottom:16}}>
          {[{id:'before',icon:'☀️',label:'ชำระก่อน 16:00'},{id:'after',icon:'🌙',label:'ชำระหลัง 16:00'}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'8px 14px',background:tab===t.id?(tab==='before'?'#E8604A':'#7AAE8E'):'transparent',color:tab===t.id?'#FFF8E7':'#2A1810',borderRadius:999,fontFamily:'"Mali"',fontWeight:800,fontSize:12,border:tab===t.id?'2px solid #2A1810':'2px solid transparent',display:'flex',alignItems:'center',gap:5,cursor:'pointer'}}>
              {t.icon} {t.label}
            </button>
          ))}
        </div>

        <Card radius={18} offset={3} style={{padding:'18px 18px',marginBottom:20}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16,padding:'8px 12px',background:tab==='before'?'#FFD93D':'#2A181011',border:`2px solid ${tab==='before'?'#2A1810':'#2A181055'}`,borderRadius:12}}>
            <span style={{fontSize:18}}>{tab==='before'?'☀️':'🌙'}</span>
            <div>
              <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:14}}>{tab==='before'?'ชำระก่อน 16:00 น.':'ชำระหลัง 16:00 น.'}</div>
              <div style={{fontSize:11,opacity:0.7}}>{tab==='before'?`รับสินค้าภายใน ${shipping.type==='cold'?'1-2':'2-3'} วัน`:`รับสินค้าภายใน ${shipping.type==='cold'?'2-3':'3-4'} วัน`}</div>
            </div>
            {isBefore && tab==='before' && <div style={{marginLeft:'auto',background:'#2A1810',color:'#FFD93D',padding:'3px 8px',borderRadius:999,fontFamily:'"Mali"',fontWeight:800,fontSize:11}}>ของคุณ</div>}
          </div>
          {steps.map((s,i)=>{
            const done=i<1,curr=i===1,last=i===steps.length-1;
            return (
              <div key={i} style={{display:'flex',gap:14,position:'relative'}}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
                  <div style={{width:40,height:40,borderRadius:'50%',background:done||curr?accent:'#FFF8E7',border:'2.5px solid #2A1810',boxShadow:curr?`3px 3px 0 #2A1810`:'none',display:'flex',alignItems:'center',justifyContent:'center',color:done||curr?'#FFF8E7':'#2A1810',fontSize:16,flexShrink:0,zIndex:2}}>{done?'✓':s.icon}</div>
                  {!last && <div style={{width:3,flex:1,minHeight:28,marginTop:2,background:done?accent:'#2A181022',borderRadius:2}}/>}
                </div>
                <div style={{paddingBottom:18,flex:1}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:16}}>{s.title}</div>
                    <div style={{fontFamily:'"Mali"',fontWeight:700,fontSize:11,color:accent,background:`${accent}22`,padding:'2px 8px',borderRadius:999,border:`1.5px solid ${accent}`}}>{s.when}</div>
                  </div>
                  <div style={{fontSize:12,opacity:0.7,lineHeight:1.5,marginTop:3}}>{s.desc}</div>
                </div>
              </div>
            );
          })}
        </Card>

        {/* contact */}
        <a href={CFG.LINE_URL} target="_blank" rel="noopener noreferrer" style={{textDecoration:'none',display:'block'}}>
          <div style={{background:'#06C755',border:'2.5px solid #2A1810',borderRadius:18,padding:'16px 18px',boxShadow:'4px 4px 0 #2A1810',display:'flex',alignItems:'center',gap:14,color:'#fff',marginBottom:24}}>
            <div style={{width:48,height:48,borderRadius:14,background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill="#06C755"><path d="M12 2C6.48 2 2 5.92 2 10.75c0 3.16 2.13 5.94 5.36 7.5-.16.6-1.02 3.5-1.06 3.74 0 0-.02.17.09.23s.24.02.24.02c.34-.05 3.91-2.56 4.53-2.98.61.09 1.23.13 1.84.13 5.52 0 10-3.92 10-8.75S17.52 2 12 2z"/></svg>
            </div>
            <div style={{flex:1}}>
              <div style={{fontFamily:'"Mali"',fontWeight:800,fontSize:16}}>มีคำถาม? แชทไลน์เลย</div>
              <div style={{fontSize:12,opacity:0.9}}>ตอบไวภายใน 1 ชม.</div>
            </div>
            <span style={{fontFamily:'"Mali"',fontWeight:800,fontSize:14}}>ทักเลย →</span>
          </div>
        </a>

        <StickerBtn bg="#E8604A" fg="#FFF8E7" size="lg" full onClick={onHome}>← กลับหน้าหลัก</StickerBtn>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// PROGRESS BAR
// ══════════════════════════════════════════════════════════════
function ProgressBar({step,color='#2A1810'}) {
  const steps=['ตะกร้า','ชำระเงิน','สำเร็จ'];
  return (
    <div style={{padding:'12px 18px 8px',display:'flex',alignItems:'center',gap:6}}>
      {steps.map((s,i)=>(
        <React.Fragment key={s}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <div style={{width:22,height:22,borderRadius:'50%',background:i<step?'#7AAE8E':(i===step-1?'#E8604A':'#FFF8E7'),border:`2px solid ${color}`,color:i<=step-1?'#FFF8E7':color,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'"Mali"',fontWeight:800,fontSize:11}}>{i<step-1?'✓':(i+1)}</div>
            <span style={{fontFamily:'"Mali"',fontWeight:700,fontSize:12,color:i===step-1?color:`${color}66`}}>{s}</span>
          </div>
          {i<2 && <div style={{flex:1,height:2,background:i<step-1?'#7AAE8E':`${color}22`,borderRadius:999}}/>}
        </React.Fragment>
      ))}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════════
function App() {
  const [page,setPage]         = useState('home');
  const [products,setProducts] = useState(PRODUCTS_DEFAULT);
  const [cart,setCart]         = useState([]);
  const [modal,setModal]       = useState(null);   // product in modal
  const [toast,setToast]       = useState('');
  const [checkoutData,setCheckoutData] = useState(null); // {info, shipping, subtotal, total}
  const [orderId,setOrderId]   = useState('');

  // Try to load products from GAS
  useEffect(()=>{
    apiCall('GET',{action:'products'}).then(res=>{
      if(res?.products?.length) setProducts(res.products);
    });
  },[]);

  const addToCart = (product, qty=1) => {
    setCart(c=>{
      const existing = c.find(i=>i.product.id===product.id);
      if(existing) return c.map(i=>i.product.id===product.id?{...i,qty:i.qty+qty}:i);
      return [...c,{product,qty}];
    });
    setToast(`✅ เพิ่ม ${product.name} ลงตะกร้าแล้ว`);
  };

  const removeFromCart = id => setCart(c=>c.filter(i=>i.product.id!==id));
  const updateQty = (id,qty) => setCart(c=>c.map(i=>i.product.id===id?{...i,qty}:i));

  const handleCheckout = (info, shipping, subtotal, total) => {
    setCheckoutData({info,shipping,subtotal,total});
    setPage('payment');
  };

  const handleSuccess = (oid) => {
    setOrderId(oid || 'ORD-LOCAL');
    setCart([]);
    setPage('confirmation');
  };

  const cartCount = cart.reduce((s,i)=>s+i.qty,0);

  return (
    <div style={{maxWidth:480,margin:'0 auto',background:'#FFF8E7',minHeight:'100vh',position:'relative',boxShadow:'0 0 40px rgba(0,0,0,0.1)'}}>
      <Header
        cartCount={cartCount}
        onCartClick={()=>{if(page!=='cart'&&page!=='payment')setPage(cart.length?'cart':'home');}}
        onHomeClick={()=>setPage('home')}
      />

      {page==='home' && (
        <HomePage
          products={products.filter(p=>p.active)}
          onProductClick={p=>setModal(p)}
          onAddToCart={addToCart}
        />
      )}

      {page==='cart' && (
        <CartPage
          cart={cart}
          products={products}
          onBack={()=>setPage('home')}
          onQtyChange={updateQty}
          onRemove={removeFromCart}
          onCheckout={handleCheckout}
        />
      )}

      {page==='payment' && checkoutData && (
        <PaymentPage
          cart={cart}
          customerInfo={checkoutData.info}
          shipping={checkoutData.shipping}
          subtotal={checkoutData.subtotal}
          total={checkoutData.total}
          onBack={()=>setPage('cart')}
          onSuccess={handleSuccess}
          setToast={setToast}
        />
      )}

      {page==='confirmation' && checkoutData && (
        <ConfirmationPage
          orderId={orderId}
          cart={cart.length ? cart : []}
          customerInfo={checkoutData?.info || {}}
          shipping={checkoutData?.shipping || {type:'cold',cost:150}}
          total={checkoutData?.total || 0}
          onHome={()=>{setPage('home');setCheckoutData(null);}}
        />
      )}

      {modal && (
        <ProductModal
          product={modal}
          onClose={()=>setModal(null)}
          onAddToCart={addToCart}
        />
      )}

      <Toast msg={toast} onClose={()=>setToast('')}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
